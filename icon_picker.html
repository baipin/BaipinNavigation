<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>挑选图标</title><link rel="stylesheet" href="/material-icons.css?v=full-v2">
<style>
:root{font-family:system-ui,sans-serif;color:#242126;--surface:#ece6f0;--hover:#eee7f7;--primary:#6750a4;--line:#ded8e5}html{scrollbar-width:thin;scrollbar-color:#998fa6 transparent}body{margin:0;background:transparent;color:inherit}*{box-sizing:border-box}html.dark{color:#eee8f1;--surface:#25232a;--hover:#40364f;--primary:#d0bcff;--line:#514b59}.tools{position:sticky;top:0;z-index:2;background:var(--surface);padding:10px 4px 12px}.search{display:flex;align-items:center;gap:10px;border-radius:28px;background:var(--hover);padding:0 14px;min-height:48px}.search input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:16px}.search input::-webkit-search-cancel-button{display:none}.search button{border:0;background:transparent;color:inherit;cursor:pointer;padding:8px;border-radius:50%}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}button{font:inherit}button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:7px 14px;background:transparent;color:inherit;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--hover);border-color:var(--primary);color:var(--primary)}#count{font-size:12px;opacity:.7;margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:4px}.item{content-visibility:auto;contain-intrinsic-size:90px 94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:94px;padding:10px 5px;border:1px solid transparent;border-radius:16px;background:transparent;color:inherit;cursor:pointer;transition:background .16s,transform .16s}.item:hover{background:var(--hover);border-color:var(--line)}.item:active{transform:scale(.96)}.item .material-icons{font-size:30px}.item small{font-size:10px;overflow-wrap:anywhere;line-height:1.3;text-align:center}#more{display:block;border:0;border-radius:24px;background:var(--hover);color:var(--primary);padding:12px 24px;margin:16px auto;cursor:pointer}[hidden]{display:none!important}.empty{padding:32px;text-align:center;opacity:.7}@media(prefers-reduced-motion:reduce){.item{transition:none}}
@media(max-width:600px){.tools{padding:8px 2px}.grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}.item{min-height:80px;padding:8px 3px;border-radius:12px}.item .material-icons{font-size:28px}.tabs{gap:6px}.tabs button{padding:7px 10px}.item small{font-size:9px;word-break:break-word}.search{padding:0 10px;gap:6px}}
</style></head><body><div class="tools"><div class="search"><span class="material-icons" aria-hidden="true">search</span><input id="search" type="search" autocomplete="off"><button id="clear" type="button" hidden><span class="material-icons">close</span></button></div><nav class="tabs" id="categories"></nav><p id="count" role="status"></p></div><div class="grid" id="icon-grid"></div><button id="more" type="button"></button></body></html>
